name: Q2 Archive XYZ avec taille
on:
  push:
    paths:
      - 'XYZ.txt'
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Creation de Q2_archive_XYZ.txt
        run: |
          echo "CHAOU Célim" > Q2_archive_XYZ.txt
          date >> Q2_archive_XYZ.txt
          echo "--- Contenu ---" >> Q2_archive_XYZ.txt
          cat XYZ.txt >> Q2_archive_XYZ.txt
          echo "--- Taille (octets) ---" >> Q2_archive_XYZ.txt
          wc -c < XYZ.txt >> Q2_archive_XYZ.txt
          
      - name: Commit et Push
        run: |
          git config --local user.email celimchaou8@gmail.com
          git config --local user.name CelimS"
          git add Q2_archive_XYZ.txt
          git commit -m "Ajout archive Q2" || exit 0
          git push
